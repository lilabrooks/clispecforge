name: Quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: python -m pip install -e ".[dev,anthropic,openai]"

      - name: Run repository gate
        run: make check PYTHON=python RUFF=ruff MYPY=mypy PYTEST=pytest

      - name: Run deterministic replay smoke test
        if: matrix.python-version == '3.14'
        run: make smoke-replay PYTHON=python
