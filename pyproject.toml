[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "clispecforge"
version = "0.4.0"
description = "Generate reviewable Python CLI scaffolds from Markdown specifications."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Lila Brooks" }]
dependencies = [
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "coverage[toml]>=7.6.0",
    "hatchling>=1.25",
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "ruff>=0.13.0",
]
anthropic = ["anthropic>=0.69"]
openai = [
    "openai>=1.0",
    "anyio>=4.4.0",
    "h11>=0.16.0",
    "idna>=3.15",
    "zipp>=3.19.1",
]

[project.scripts]
clispecforge = "agent_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_cli"]

# Ship the default specs and skills inside the package so the installed CLI
# works from any directory (e.g. `pipx install` from GitHub). A checkout's own
# specs/cli and skills/agent still take precedence when present.
[tool.hatch.build.targets.wheel.force-include]
"specs" = "agent_cli/_bundled/specs"
"skills" = "agent_cli/_bundled/skills"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "specs",
    "skills",
    "docs",
    "README.md",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PIE",
    "PL",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "UP",
    "W",
]
ignore = [
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/agent_cli"]

[[tool.mypy.overrides]]
module = ["anthropic", "openai"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["agent_cli"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
